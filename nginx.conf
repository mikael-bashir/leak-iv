worker_processes 1;
daemon off;
error_log /tmp/error.log;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Move temp writes to /tmp to avoid Permission Denied
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;

    server {
        listen 7860;
        
        location / {
            proxy_pass http://127.0.0.1:8000;
            
            # --- THE HARDCODED IDENTITY ---
            # We strip away all HF variables and forcefully tell Python exactly who it is.
            proxy_set_header Host barkingtree-leak-i.hf.space;
            proxy_set_header X-Forwarded-Host barkingtree-leak-i.hf.space;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;

            # Streaming settings
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
        }
    }
}